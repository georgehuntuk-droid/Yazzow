# Runs on GitHub when you push to main (separate from Netlify deploy).
# A red X here does NOT take yazzow.com offline — check Netlify → Deploys for the live site.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://yazzow.com
          # Supply placeholder Supabase keys so the compile-time validation succeeds during build.
          SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
