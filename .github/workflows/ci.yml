# Runs on GitHub when you push to main (separate from Netlify deploy).
# A red X here does NOT take yazzow.com offline — check Netlify → Deploys for the live site.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://yazzow.com
          # Omit Supabase keys so CI does not call a fake project during build.
          # Netlify production uses real vars from Site configuration → Environment variables.
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
