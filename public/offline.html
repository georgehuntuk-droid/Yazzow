<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Yazzow</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fbfbf8;
      color: #334e40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 24px;
      background-color: #ffffff;
      border: 1px solid rgba(68, 55, 164, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: #4437a4;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px 0;
      color: #554fa6;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #4437a4;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #312782;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection. Yazzow will automatically reconnect when you go back online.</p>
    <a href="javascript:window.location.reload();" class="btn">Retry Connection</a>
  </div>
</body>
</html>
